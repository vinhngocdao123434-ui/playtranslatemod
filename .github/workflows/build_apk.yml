name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout User Repo
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Checkout Original Repo
        run: |
          git clone --recursive https://github.com/dominostars/playtranslate.git original_repo
          
      - name: Sync User Changes
        run: |
          rsync -a --exclude='.git' user_repo/ original_repo/
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        working-directory: original_repo
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playtranslate-debug-apk
          path: original_repo/app/build/outputs/apk/debug/app-debug.apk
