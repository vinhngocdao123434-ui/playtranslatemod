name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Submodules for ZIP downloads
        run: |
          if [ -f .gitmodules ]; then
            git config --file .gitmodules --get-regexp path | awk '{ print $2 }' > paths.txt
            git config --file .gitmodules --get-regexp url | awk '{ print $2 }' > urls.txt
            paste paths.txt urls.txt | while read path url; do
              if [ ! -d "$path/.git" ]; then
                echo "Manually cloning $url to $path"
                rm -rf "$path"
                git clone --recursive "$url" "$path"
              fi
            done
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playtranslate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
